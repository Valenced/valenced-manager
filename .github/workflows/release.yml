name: Release

on:
    workflow_dispatch:
    push:
        branches:
            - main
            - dev

jobs:
    release:
        name: Release
        permissions:
            contents: write
        runs-on: ubuntu-latest
        env:
            RESEAM_BIN: ${{ github.workspace }}/engine/reseam
            RESEAM_BUNDLE_KEY: ${{ github.workspace }}/bundle-signing.key
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup Java
              uses: actions/setup-java@v4
              with:
                  distribution: "temurin"
                  java-version: "21"

            # The app trusts the key its own bundle is signed with, so each build can make a new one.
            - name: Install the Reseam CLI and a bundle signing key
              run: |
                  mkdir -p engine
                  version=$(sed -n 's/.*id("app.reseam.workspace") version "\(.*\)".*/\1/p' patches/settings.gradle.kts)
                  curl -fsSL -o engine/reseam https://cdn.reseam.app/engine/v$version/reseam-linux-x64
                  chmod +x engine/reseam
                  engine/reseam bundle keygen --out bundle-signing.key

            - name: Setup Gradle
              uses: gradle/actions/setup-gradle@v6
              with:
                  cache-provider: basic

            - name: Build
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: ./gradlew assembleRelease --no-daemon

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "lts/*"
                  cache: "npm"

            - name: Install dependencies
              run: npm install

            - name: Setup keystore
              run: |
                  echo "${{ secrets.KEYSTORE }}" | base64 --decode > "app/keystore.jks"

            - name: Release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
                  KEYSTORE_ENTRY_ALIAS: ${{ vars.KEYSTORE_ENTRY_ALIAS }}
                  KEYSTORE_ENTRY_PASSWORD: ${{ secrets.KEYSTORE_ENTRY_PASSWORD }}
              run: |
                  npx semantic-release
